name: Engineering Harness CI Pipeline

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality, Types & Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements.runtime.txt -r requirements.dev.txt

      - name: Run Ruff Linter
        run: ruff check src/ tests/

      - name: Run Black Code Format Verification
        run: python -m black --check src/ tests/

      - name: Run MyPy Type Checker
        run: mypy src/

      - name: Run Repository Secret Scan
        run: python scripts/scan_secrets.py

      - name: Check Harness Consistency
        run: python scripts/check_harness_consistency.py

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.runtime.txt
          pip install pip-audit
          pip install cyclonedx-bom

      - name: Run pip-audit
        run: pip-audit --ignore-vuln PYSEC-2026-2447 --ignore-vuln PYSEC-2026-3046

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format json --output-file sbom.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-json
          path: sbom.json

  unit-and-integration-tests:
    name: Test Suite Runtime Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements.runtime.txt -r requirements.dev.txt

      - name: Execute Unit and Integration Tests
        run: pytest tests/unit/ tests/integration/

  coverage-gate:
    name: Coverage Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-gate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements.runtime.txt -r requirements.dev.txt

      - name: Execute Unit and Integration Tests with Coverage (Min 90%)
        run: pytest tests/unit/ tests/integration/ --cov=pokemon_tcg_rag --cov-fail-under=90 --cov-report=xml

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.xml
