networks:
  pokemon_net:
    driver: bridge

volumes:
  qdrant_storage:
  postgres_data:
  prometheus_data:
  grafana_data:

services:
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: pokemon_qdrant
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - pokemon_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: pokemon_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-pokemon_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-pokemon_owner_password}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER:-pokemon_owner}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-pokemon_owner_password}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-pokemon_migrator}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:-pokemon_migrator_password}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-pokemon_runtime}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-pokemon_runtime_password}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - pokemon_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokemon_user} -d ${POSTGRES_DB:-pokemon_tcg_rag_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrations:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: pokemon_db_migrations
    command: ["python", "scripts/run_db_migrations.py"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-pokemon_migrator}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:-pokemon_migrator_password}
    networks:
      - pokemon_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingestion
    container_name: pokemon_ingestion
    command: ["python3", "scripts/run_ingestion.py"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    networks:
      - pokemon_net
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    profiles:
      - ingestion

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: pokemon_rag_api
    command: ["uvicorn", "pokemon_tcg_rag.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-pokemon_runtime}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-pokemon_runtime_password}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    networks:
      - pokemon_net
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: pokemon_rag_ui
    command: ["streamlit", "run", "src/pokemon_tcg_rag/ui/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POKERAG_API_URL: http://api:8000/api/v1
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    networks:
      - pokemon_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: pokemon_prometheus
    expose:
      - "9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - pokemon_net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: pokemon_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    expose:
      - "3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - pokemon_net
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
