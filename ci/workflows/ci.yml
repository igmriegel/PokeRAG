name: Engineering Harness CI Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check src/ tests/

      - name: Run Black Code Format Verification
        run: black --check src/ tests/

      - name: Run MyPy Type Checker
        run: mypy src/

  unit-and-integration-tests:
    name: Test Suite & Coverage Verification
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute Unit Tests with Coverage (Min 90%)
        run: pytest tests/unit/ --cov=src/pokemon_tcg_rag --cov-fail-under=90 --cov-report=xml

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.xml
